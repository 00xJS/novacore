# The AI proxy's tests (server/ai-proxy) whenever it changes. Node 22.18+ runs
# the TypeScript directly, so there is nothing to install.
name: AI proxy tests

on:
  push:
    branches: [main]
    paths: ['server/ai-proxy/**', '.github/workflows/ai-proxy.yml']
  pull_request:
    paths: ['server/ai-proxy/**', '.github/workflows/ai-proxy.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/ai-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version && node --test test/*.test.ts
